<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi página HTML5</title>
</head>
<body>
    <p id="parrafos.ejemplos">¡Hola, mundo!</p>
    <script>
        let parrafo = document.getElementById("parrafoEjemplo")
        console.log(parrafo)

        let parrafo2 = document.createElement("h1")

        var contenido = document.createTextNode("Hola mundo desde parrafo ")
        parrafo2.appendChild(contenido)

        document.body.appendChild(parrafo2)

        setTimeout(()=>{
            document.body.appendChild(parrafo2)

        },2000)
        
    </script>
</body>
</html>
